<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">RBT robotics runtime</title>
  <desc id="desc">A geometric RBT wordmark beside three software components connected through a shared-memory bus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071722"/>
      <stop offset="0.55" stop-color="#0a1d2b"/>
      <stop offset="1" stop-color="#0b1827"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f5fa"/>
      <stop offset="1" stop-color="#9bc9ee"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45d7bc"/>
      <stop offset="1" stop-color="#68aef1"/>
    </linearGradient>
    <radialGradient id="halo" cx="73%" cy="49%" r="57%">
      <stop offset="0" stop-color="#17465a" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#0b1a28" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7da6b8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1280" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="280" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="280" rx="16" fill="url(#halo)"/>

