adapter_license = "See repository LICENSE-APACHE and LICENSE-MIT"
adapter_name = "RBT native Gemini335 camera adapter"

[sdk]
name = "OrbbecSDK"
version = "2.10.6"
platform = "Linux x86_64"
distribution_repository = "https://github.com/orbbec/OrbbecSDK_ROS2.git"
distribution_commit = "c153462518ad674650bafa4464fda72c27ab797a"
distribution_license = "Apache-2.0 wrapper; SDK components follow preserved per-component licenses"
manifest = "sdk-manifest.json"
manifest_sha256 = "729f0a39f5ca301549f438c7d3eb41de99e6f7bf5ed3ddfe7a45120854eb06f1"
sdk_library = "orbbec_camera/SDK/x64/lib/libOrbbecSDK.so.2.10.6"
sdk_library_sha256 = "ade25a2a2fd5a3a5d4a8142d62b03fddb0594e1ab04096cdc4cc03c02ed74d2d"
extension_license = "licenses/OrbbecSDK-LICENSE.txt"
extension_license_sha256 = "010b2381c54551d1928784124282a7ff8cf6786f01846179bde3f810b7cd6b30"
third_party_licenses = "orbbec_camera/SDK/licenses"

[sdk.native_source_reference]
repository = "https://github.com/orbbec/OrbbecSDK_v2.git"
commit = "85e94c4ee4032817df2e33228dbd7f51517d3d4e"
license = "MIT for SDK core; extension library has separate terms"

[sdk.arm64]
platform = "Linux ARM64"
manifest = "sdk-manifest-arm64.json"
manifest_sha256 = "53b5d2de4506a20c8d35098df1a87fd939b7f81a65f4149c88ccb0fbf968b29e"
sdk_library = "orbbec_camera/SDK/arm64/lib/libOrbbecSDK.so.2.10.6"
sdk_library_sha256 = "319c9fd4b1a02bca231953545801ee0e957bff537a9c16d822632e4a5db53dde"
extension_license = "licenses/OrbbecSDK-LICENSE.txt"
extension_license_sha256 = "010b2381c54551d1928784124282a7ff8cf6786f01846179bde3f810b7cd6b30"
third_party_licenses = "orbbec_camera/SDK/licenses"

[bootstrap.arm64]
default_prefix = "target/orbbec-sdk-2.10.6-arm64"

[bootstrap]
script = "scripts/bootstrap_sdk.sh"
default_prefix = "target/orbbec-sdk-2.10.6"
udev_rule = "share/orbbec/udev/99-obsensor-libusb.rules (manual installation only)"
installs_system_udev_rule = false
flashes_firmware = false
