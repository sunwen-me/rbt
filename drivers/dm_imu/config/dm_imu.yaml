serial_port: /dev/dm_imu
baud: 921600
# Publish at this rate while parsing every valid serial sample.
publish_rate_hz: 200
frame: imu_link
topic: /imu/data

# The reference ROS driver passed gyro and acceleration values through. The
# defaults record the assumed source units; verify them against device output.
source_units:
  gyro: rad_s
  acceleration: m_s2

# Only the first record tag is established by the available reference source.
# Keep the other tags and all record terminators unchecked until captured from
# hardware, then add expected values here to enable strict validation.
protocol:
  expected_tags:
    - [85, 170, 1, 1]
    - null
    - null
  expected_terminators:
    - null
    - null
    - null

startup:
  configure_device: false
  save_parameters: false

reconnect:
  initial_delay_ms: 100
  maximum_delay_ms: 5000
