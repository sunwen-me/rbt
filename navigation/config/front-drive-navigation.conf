# Chassis/wheel profile confirmed against robot-sim. Resource paths are relative
# to this file. Supply the deployment's --prefix, --tf-map and --tf-odom.
planner=smac-lattice
robot-geometry=front-drive-geometry.yaml
lattice-file=lattice/diff-5cm-0_5m.json
allow-reverse=1
controller=rpp-dwpp
planning-clearance=0.0
plan-timeout-ms=3000
control-hz=50
map-hz=20
input-timeout-ms=250
map-timeout-ms=2000
max-linear=0.2
max-angular=0.5
