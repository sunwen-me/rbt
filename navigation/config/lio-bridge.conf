# Must match the navigation runtime. Change both authority IDs together when
# running independent systems; only this bridge may publish these authorities.
provider=super-lio
prefix=rbt/navigation/lio
static-prefix=rbt/navigation/static
tf-map=765854aa-bc4c-4857-85c5-57657394768f
tf-odom=0a570f77-acbf-4ede-8054-d5ccca2ca252
max-frame-age-ms=250
static-map-age-ms=2000
# Measured base_footprint <- base_link installation transform, metres/radians.
# Identity is an example, not a claim about the physical robot.
base-x=0
base-y=0
base-z=0
base-yaw=0
obstacle-min-height=0.1
obstacle-max-height=1.5
# Example measured body radius; must not exceed the physical footprint.
obstacle-self-radius=0.18
obstacle-max-range=10
