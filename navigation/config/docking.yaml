# Units: metres, radians, seconds, and milliseconds as named.
controller:
  k_phi: 3.0
  k_delta: 2.0
  beta: 0.4
  lambda: 2.0
  slowdown_radius: 0.25
  v_linear_min: 0.1
  v_linear_max: 0.25
  v_angular_max: 0.75
docking_threshold: 0.05
staging_x_offset: -0.7
staging_yaw_offset: 0.0
prestaging_tolerance: 0.5
approach_timeout_s: 30.0
max_input_age_ms: 250
max_map_age_s: 2.0
max_retries: 3
dock_backwards: false
use_collision_detection: true
projection_time_s: 5.0
simulation_time_step_s: 0.1
dock_collision_threshold: 0.3
