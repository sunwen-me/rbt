# Pair with lio-bridge.conf. Physical robot footprint and limits need measurement.
prefix=rbt/navigation/lio
tf-map=765854aa-bc4c-4857-85c5-57657394768f
tf-odom=0a570f77-acbf-4ede-8054-d5ccca2ca252
source-id=1
guard-source-id=100
estop-source=2
desired-topic=rbt/navigation/lio/desired_cmd_vel
cmd-vel-topic=/cmd_vel
guard-timeout-ms=250
base-timeout-ms=250
cmd-ttl-ms=100
control-hz=50
map-hz=20
input-timeout-ms=250
map-timeout-ms=2000
plan-timeout-ms=500
# Example 0.18 m body; replace with the measured installation before use.
# Extra global clearance leaves room for curved tracking of discrete A* corners.
robot-radius=0.18
planning-clearance=0.30
controller=rpp-dwpp
max-linear=0.2
max-angular=0.5
